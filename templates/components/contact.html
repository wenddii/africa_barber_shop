<section class="section-pad contact-section" id="contact">
    <div class="container contact-grid">
        <div class="section-heading left-align reveal-left">
            <span class="eyebrow"><i class="fa-solid fa-phone"></i> {{ t.contact_eyebrow }}</span>
            <h2>{{ t.contact_heading }}</h2>
            <p>{{ t.contact_p }}</p>

            <div class="contact-details reveal" data-delay="100">
                <a class="contact-link" href="tel:{{ shop.phone_number }}"><i class="fa-solid fa-phone"></i> {{ shop.phone_number|default:"Call now" }}</a>
                <p class="contact-meta"><i class="fa-solid fa-location-dot"></i> {{ shop.location|default:"Addis Ababa, Ethiopia" }}</p>
                <p class="contact-meta"><i class="fa-solid fa-clock"></i> {{ shop.opening_hours|default:"Open for scheduled appointments" }}</p>
            </div>

            <div style="margin-top: 25px;">
                <a href="{% url 'booking' %}" class="button button-primary"><i class="fa-solid fa-calendar-check"></i> {{ t.contact_btn_online }}</a>
            </div>
        </div>

        <div class="contact-card reveal-right">
            <form method="POST" action="{% url 'home' %}#contact" class="contact-form">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="button button-primary button-full">{{ t.send_message }}</button>
            </form>
        </div>
    </div>
</section>
