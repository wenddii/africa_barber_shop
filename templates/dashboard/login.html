<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barber Staff Login — Paradise Barber Shop</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous">
    
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: #0f1115;
            color: #f0f2f5;
            font-family: 'Inter', system-ui, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 1rem;
            -webkit-font-smoothing: antialiased;
        }

        /* Ambient glow */
        body::before {
            content: '';
            position: fixed;
            top: -10rem;
            left: 50%;
            transform: translateX(-50%);
            width: 30rem;
            height: 30rem;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(212, 175, 55, 0.06), transparent 65%);
            pointer-events: none;
            z-index: 0;
        }

        .login-card {
            background: #161920;
            border: 1px solid #262933;
            border-radius: 16px;
            padding: clamp(28px, 5vw, 44px);
            width: 100%;
            max-width: 420px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
            text-align: center;
            position: relative;
            z-index: 1;
            animation: cardEntry 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes cardEntry {
            from {
                opacity: 0;
                transform: translateY(20px) scale(0.97);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .logo-mark {
            width: 50px; height: 50px;
            background: #d4af37;
            color: #000;
            font-size: 1.6rem;
            font-weight: 800;
            border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 20px;
            box-shadow: 0 4px 20px rgba(212, 175, 55, 0.25);
        }

        h2 {
            font-size: 1.4rem;
            margin-bottom: 6px;
            color: #fff;
            font-weight: 700;
        }

        p {
            color: #8c93a0;
            font-size: 0.88rem;
            margin-bottom: 28px;
            line-height: 1.5;
        }

        .form-group {
            text-align: left;
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-size: 0.82rem;
            color: #8c93a0;
            margin-bottom: 6px;
            font-weight: 500;
        }

        label i {
            margin-right: 4px;
            font-size: 0.78rem;
        }

        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 12px 14px;
            background: #1c202a;
            border: 1px solid #262933;
            border-radius: 8px;
            color: #fff;
            font-family: inherit;
            font-size: 0.95rem;
            min-height: 46px;
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        input::placeholder {
            color: #5a5f6e;
        }

        input:focus {
            border-color: #d4af37;
            box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.1);
        }

        .btn-submit {
            width: 100%;
            padding: 13px;
            background: #d4af37;
            color: #000;
            font-weight: 700;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.95rem;
            margin-top: 8px;
            transition: background 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 4px 16px rgba(212, 175, 55, 0.2);
        }

        .btn-submit:hover {
            background: #b5932a;
            transform: translateY(-1px);
            box-shadow: 0 6px 24px rgba(212, 175, 55, 0.3);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        .alert {
            padding: 10px 14px;
            border-radius: 8px;
            background: rgba(230, 57, 70, 0.15);
            color: #e63946;
            border: 1px solid rgba(230, 57, 70, 0.3);
            font-size: 0.85rem;
            margin-bottom: 20px;
            text-align: left;
            display: flex;
            align-items: center;
            gap: 8px;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="logo-mark">P</div>
        <h2>Barber Staff Login</h2>
        <p>Enter your credentials to access the shop dashboard.</p>

        {% if messages %}
            {% for message in messages %}
                <div class="alert"><i class="fa-solid fa-circle-exclamation"></i> {{ message }}</div>
            {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <div class="form-group">
                <label><i class="fa-solid fa-user"></i> Username</label>
                <input type="text" name="username" required placeholder="Enter staff username">
            </div>

            <div class="form-group">
                <label><i class="fa-solid fa-lock"></i> Password</label>
                <input type="password" name="password" required placeholder="Enter password">
            </div>

            <button type="submit" class="btn-submit"><i class="fa-solid fa-right-to-bracket"></i> Log In to Dashboard</button>
        </form>
    </div>

</body>
</html>
